# Nginx HTTPS 反向代理配置
# 适用于 qhzs.work 域名

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name qhzs.work;

    # Let's Encrypt 证书验证
    location ~ /\.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name qhzs.work;

    # SSL 证书配置（请替换为你的证书路径）
    ssl_certificate /etc/nginx/ssl/qhzs.work.pem;
    ssl_certificate_key /etc/nginx/ssl/qhzs.work.key;

    # SSL 安全配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS（可选，首次配置建议注释）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # 日志配置
    access_log /var/log/nginx/qhzs.work_access.log;
    error_log /var/log/nginx/qhzs.work_error.log;

    # GZIP 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # API 反向代理
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # 设置代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小限制
        client_max_body_size 50M;
    }

    # 静态文件（如果需要）
    location /images/ {
        alias /path/to/your/server/tmp/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /evidence/ {
        alias /path/to/your/server/data/evidence/;
        expires 7d;
        autoindex off;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
